[package]
name = "beatmaker_backend"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "beatmaker_backend"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.30"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pythonize = "0.30"
